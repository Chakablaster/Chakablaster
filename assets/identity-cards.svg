<svg width="1600" height="280" viewBox="0 0 1600 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2237"/>
      <stop offset="100%" stop-color="#122B42"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#07131f" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(20,20)" filter="url(#shadow)">
    <!-- Card 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="370" height="240" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="28" y="28" width="72" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.95"/>
      <circle cx="314" cy="48" r="34" fill="#17344F" opacity="0.9"/>
      <path d="M304 49.5L313 58.5L326 39" stroke="#BEE9FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="102" fill="#F6FBFF" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">CS Student</text>
      <text x="28" y="147" fill="#ADC4D8" font-size="21" font-family="Inter, Arial, sans-serif">Learning by building</text>
      <text x="28" y="194" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">Always turning concepts into</text>
      <text x="28" y="219" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">hands-on work.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(390,0)">
      <rect x="0" y="0" width="370" height="240" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="28" y="28" width="72" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.95"/>
      <circle cx="314" cy="48" r="34" fill="#17344F" opacity="0.9"/>
      <path d="M303 57L325 35M303 35L325 57" stroke="#BEE9FF" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="102" fill="#F6FBFF" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Problem Solver</text>
      <text x="28" y="147" fill="#ADC4D8" font-size="21" font-family="Inter, Arial, sans-serif">Breaking ideas down</text>
      <text x="28" y="194" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">I like finding the core issue</text>
      <text x="28" y="219" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">before building the answer.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(780,0)">
      <rect x="0" y="0" width="370" height="240" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="28" y="28" width="72" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.95"/>
      <circle cx="314" cy="48" r="34" fill="#17344F" opacity="0.9"/>
      <path d="M300 58C305 45 314 39 326 38C324 52 316 61 301 60" stroke="#BEE9FF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M305 58C309 52 314 48 322 45" stroke="#BEE9FF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <text x="28" y="102" fill="#F6FBFF" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Creative Builder</text>
      <text x="28" y="147" fill="#ADC4D8" font-size="21" font-family="Inter, Arial, sans-serif">Making things cleaner</text>
      <text x="28" y="194" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">I enjoy shaping rough ideas</text>
      <text x="28" y="219" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">into simple useful experiences.</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(1170,0)">
      <rect x="0" y="0" width="370" height="240" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="28" y="28" width="72" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.95"/>
      <circle cx="314" cy="48" r="34" fill="#17344F" opacity="0.9"/>
      <circle cx="314" cy="48" r="16" fill="none" stroke="#BEE9FF" stroke-width="4.5"/>
      <path d="M314 29V67M295 48H333" stroke="#BEE9FF" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
      <text x="28" y="102" fill="#F6FBFF" font-size="34" font-family="Inter, Arial, sans-serif" font-weight="700">Maldivian</text>
      <text x="28" y="147" fill="#ADC4D8" font-size="21" font-family="Inter, Arial, sans-serif">Based in Malaysia</text>
      <text x="28" y="194" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">Island roots, new surroundings,</text>
      <text x="28" y="219" fill="#D8E8F4" font-size="17" font-family="Inter, Arial, sans-serif" opacity="0.92">always building forward.</text>
    </g>
  </g>
</svg>
